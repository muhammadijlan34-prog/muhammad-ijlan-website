<script>
/* ==========================================================
   പുതിയ ഓഡിയോ ചേർക്കാൻ:
   1) ഫയൽ GitHub-ലെ assets ഫോൾഡറിൽ അപ്‌ലോഡ് ചെയ്യുക
   2) താഴെ ലിസ്റ്റിൽ ഒരു വരി കൂടി ചേർക്കുക (ഫയലിന്റെ പേര് കൃത്യമായിരിക്കണം)
   ഉദാ:  { title: "Announcement 3", file: "assets/background-announcement-3.m4a" },
   ========================================================== */
var ANNOUNCEMENTS = [
  { title: "Announcement 1", file: "assets/background-announcement-1.m4a" },
  { title: "Announcement 2", file: "assets/background-announcement-2.m4a" }
];

(function () {
  var list = document.getElementById('audioList');
  var players = [];
  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  ANNOUNCEMENTS.forEach(function (item) {
    var card = document.createElement('div');
    card.className = 'card audio-card reveal';
    card.innerHTML =
      '<h3>🎙 ' + item.title + '</h3>' +
      '<div class="wave" aria-hidden="true"></div>' +
      '<div class="player">' +
        '<button class="play-btn" type="button" aria-label="Play">▶</button>' +
        '<div class="player-main">' +
          '<input class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">' +
          '<div class="times"><span class="cur">0:00</span><span class="dur">--:--</span></div>' +
        '</div>' +
      '</div>' +
      '<a class="download-btn" href="' + item.file + '" download="' +
        item.title.replace(/\s+/g, '-') + '.' + item.file.split('.').pop() + '">📥 Download</a>';
    list.appendChild(card);

    var wave = card.querySelector('.wave');
    for (var k = 0; k < 28; k++) {            // ശബ്ദതരംഗ ബാറുകൾ (പ്ലേ ചെയ്യുമ്പോൾ മാത്രം ഉയർന്നു താഴും)
      var bar = document.createElement('span');
      bar.style.setProperty('--h', (10 + Math.round(Math.random() * 20)) + 'px');
      bar.style.animationDelay = (-Math.random()).toFixed(2) + 's';
      wave.appendChild(bar);
    }

    var audio = new Audio();
    audio.preload = 'metadata';
    audio.src = item.file;
    players.push(audio);

    var btn = card.querySelector('.play-btn'),
        seek = card.querySelector('.seek'),
        cur = card.querySelector('.cur'),
        dur = card.querySelector('.dur');

    audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', function () {
      cur.textContent = fmt(audio.currentTime);
      if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    });
    audio.addEventListener('play', function () { btn.textContent = '⏸'; card.classList.add('playing'); });
    audio.addEventListener('pause', function () { btn.textContent = '▶'; card.classList.remove('playing'); });
    audio.addEventListener('ended', function () { audio.currentTime = 0; seek.value = 0; });
    audio.addEventListener('error', function () { dur.textContent = 'File not found'; btn.disabled = true; });

    btn.addEventListener('click', function () {
      if (audio.paused) {
        players.forEach(function (p) { if (p !== audio) p.pause(); });   // ഒരു സമയം ഒരെണ്ണം മാത്രം
        audio.play();
      } else {
        audio.pause();
      }
    });
    seek.addEventListener('input', function () {
      if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
    });
  });
})();
</script>
